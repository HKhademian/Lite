name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            igniter/package-lock.json
            editors/vscode/package-lock.json

      - name: Install igniter dependencies
        working-directory: igniter
        run: npm ci

      - name: Install editor test dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Strict TypeScript check
        working-directory: igniter
        run: npm run check

      - name: Lite test and verification gate
        run: ./lite test

      - name: Coverage gate
        run: ./lite verify --all --coverage

      - name: Editor grammar tests
        working-directory: editors/vscode
        run: npm test

      - name: Bootstrap release packaging smoke test
        run: |
          node compiler/scripts/release.ts prepare .cache/release-smoke
          node compiler/scripts/release.ts native .cache/native-smoke .cache/release-smoke
          mkdir -p .cache/extracted-release
          tar -xf .cache/release-smoke/*-bootstrap.tar.gz -C .cache/extracted-release
          cd .cache/extracted-release
          test ! -e .git
          test ! -e igniter/node_modules
          test "$(./lite run igniter/tests/compiler/001-001-report-int-42.lts)" = 42
          ./litec --target c igniter/tests/compiler/001-001-report-int-42.lts > hello.c
          cc -std=c11 -Wall -Wextra -Werror hello.c -o hello
          test "$(./hello)" = 42
