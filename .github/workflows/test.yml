name: Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: node tools/ci.ts {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: igniter/.node-version
          cache: npm
          cache-dependency-path: |
            igniter/package-lock.json
            editors/vscode/package-lock.json
      - name: Install locked development tools
        run: install
      - name: Strict types, docs, versions and declarative cases
        run: check
      - name: Generated regression and real command contracts
        run: test
      - name: Editor grammar
        run: editor
      - name: Coverage registration
        run: coverage
      - name: Report and preserve the known TS migration failures
        run: migration
      - name: Verified case benchmark smoke test
        run: bench
      - name: Complete generated path without T00 or Git metadata
        run: no-t00
      - name: Extracted source distribution smoke test
        run: package
