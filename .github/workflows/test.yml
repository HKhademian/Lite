name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            igniter/package-lock.json
            editors/vscode/package-lock.json

      - name: Install igniter dependencies
        working-directory: igniter
        run: npm ci

      - name: Install editor test dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Strict TypeScript check
        working-directory: igniter
        run: npm run check

      - name: Lite test and verification gate
        run: ./lite test

      - name: Coverage gate
        run: ./lite verify --all --coverage

      - name: Editor grammar tests
        working-directory: editors/vscode
        run: npm test

      - name: Generated TS regression suite and artifacts without T00
        run: |
          node --test compiler/scripts/release-streams.test.ts
          mkdir -p .cache/ts-smoke
          git archive HEAD | tar -x -C .cache/ts-smoke
          cd .cache/ts-smoke
          test ! -e .git
          test ! -e igniter/node_modules
          rm igniter/lite.ts igniter/bootstrap.ts igniter/cli.ts igniter/bundle-cli.ts
          ln -s "$GITHUB_WORKSPACE/igniter/node_modules" igniter/node_modules
          ./lite test --full
          ./lite verify --all --filter features/int-arithmetic.json --no-cache
          ./lite check igniter/tests/compiler/001-001-report-int-42.lts
          ./lite compile igniter/tests/compiler/001-001-report-int-42.lts > hello.ts
          test "$(node compiler/entry.ts hello.ts)" = 42
