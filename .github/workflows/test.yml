name: Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: node tools/ci.ts {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: igniter/.node-version
          cache: npm
          cache-dependency-path: |
            igniter/package-lock.json
            editors/vscode/package-lock.json
      - name: Install locked development tools
        run: install
      - name: Strict types, docs, versions and declarative cases
        run: check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: node tools/ci.ts {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: igniter/.node-version
          cache: npm
          cache-dependency-path: |
            igniter/package-lock.json
            editors/vscode/package-lock.json
      - name: Install locked development tools
        run: install
      - name: Generated regression and real command contracts
        run: test

  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: node tools/ci.ts {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: igniter/.node-version
          cache: npm
          cache-dependency-path: |
            igniter/package-lock.json
            editors/vscode/package-lock.json
      - name: Install locked development tools
        run: install
      - name: Editor grammar
        run: editor

  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: node tools/ci.ts {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: igniter/.node-version
          cache: npm
          cache-dependency-path: |
            igniter/package-lock.json
            editors/vscode/package-lock.json
      - name: Install locked development tools
        run: install
      - name: Coverage registration
        run: coverage

  migration-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: node tools/ci.ts {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: igniter/.node-version
          cache: npm
      - name: Report and preserve the known TS migration failures
        run: migration

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: node tools/ci.ts {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: igniter/.node-version
          cache: npm
          cache-dependency-path: igniter/package-lock.json
      - name: Install locked development tools
        run: install
      - name: Extracted source distribution smoke test
        run: package

  generated-archive:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: node tools/ci.ts {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: igniter/.node-version
          cache: npm
          cache-dependency-path: |
            igniter/package-lock.json
            editors/vscode/package-lock.json
      - name: Install locked development tools
        run: install
      - name: Complete self-host path without Git metadata
        run: self-host
