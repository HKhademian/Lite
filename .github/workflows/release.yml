name: Component release

on:
  push:
    tags:
      - 'lite-v*'
      - 'lang-v*'
      - 'script-v*'
      - 'igniter-v*'
      - 'compiler-v*'
      - 'cli-v*'
      - 'formatter-v*'
      - 'runtime-v*'
      - 'std-v*'
      - 'builtins-v*'
      - 'check-v*'
      - 'test-v*'
      - 'verify-v*'
      - 'bench-v*'
      - 'release-v*'
      - 'docs-v*'
      - 'vscode-v*'
      - 'linker-v*'
      - 'doctor-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: component-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: node tools/ci.ts {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: igniter/.node-version
      - name: Install locked checking tools
        run: install
      - name: Validate the selected component readiness profile
        run: release-check
  package:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: node tools/ci.ts {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: igniter/.node-version
      - name: Install development and packaging tools
        run: install
      - name: Validate component readiness and package exact tagged sources
        run: package
      - uses: actions/upload-artifact@v7
        with:
          name: component-release
          path: .cache/release/*
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: package
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: node tools/ci.ts {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: igniter/.node-version
      - uses: actions/download-artifact@v8
        with:
          name: component-release
          path: .cache/release
      - name: Upload draft assets and publish the immutable component release
        run: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
