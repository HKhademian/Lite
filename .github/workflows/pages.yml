name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: igniter/.node-version
      - name: Install igniter dependencies
        run: npm ci --prefix igniter
      - name: Restore content-addressed Lite compiler and site caches
        uses: actions/cache@v4
        with:
          path: |
            dist/bootstrap
            dist/compiler-cache
            dist/tools
            dist/cache
          key: lite-pages-${{ runner.os }}-${{ hashFiles('compiler/bootstrap/seed.ts', 'compiler/src/**', 'lib/**', 'tools/src/**', 'site/src/**') }}
          restore-keys: |
            lite-pages-${{ runner.os }}-
      - name: Build and verify the public showcase site
        run: ./site/build.ts --verbose
      - name: Run site checks
        run: node --test --test-concurrency=1 --test-reporter=spec site/features.test.ts site/build.test.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
