<g font-family="Helvetica Neue,Arial,sans-serif" fill="#252b28"><text x="95" y="418" font-size="18" font-weight="600">01 / Soft curve</text><text x="449" y="418" font-size="18" font-weight="600">02 / Slender</text><text x="803" y="418" font-size="18" font-weight="600">03 / Feather to the left</text></g>
<g font-family="Helvetica Neue,Arial,sans-serif" fill="#737b77" font-size="15"><text x="95" y="447">A little more movement.</text><text x="449" y="447">The clearest upright l.</text><text x="803" y="447">The l leads into its foot.</text></g>
<g font-family="Helvetica Neue,Arial,sans-serif" fill="#26302c"><text x="70" y="574" font-size="17">Working sketches: the spine and foot are the l; the thin outline and short strokes suggest a feather.</text><text x="70" y="608" font-size="15" fill="#737b77">Next refinement: tune the curves and test a simplified small-size version.</text></g>
