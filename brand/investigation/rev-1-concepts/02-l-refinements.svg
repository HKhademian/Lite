<g font-family="Helvetica Neue,Arial,sans-serif" fill="#252a28"><text x="70" y="80" font-size="30" font-weight="600">lite · refining the l</text><text x="70" y="115" font-size="17" fill="#737b77">Four early sketches · a letter first, a lightness cue second</text></g>
<g fill="none" stroke="#dddfda"><path d="M70 145H1130M70 550H1130M335 145V550M600 145V550M865 145V550"/></g>
<!-- soft feather: upright tapered vane with open l foot -->
