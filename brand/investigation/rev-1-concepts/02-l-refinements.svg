<g transform="translate(937 198)" fill="none" stroke="#147a70" stroke-linecap="round" stroke-linejoin="round"><path d="M35 9 V88 Q35 109 55 109 H84" stroke-width="9"/><path d="M76 18 V38 M66 28 H86" stroke-width="4"/></g>
<g font-family="Helvetica Neue,Arial,sans-serif"><g font-size="46" fill="#252a28"><text x="165" y="405" text-anchor="middle">lite</text><text x="435" y="405" text-anchor="middle">lite</text><text x="700" y="405" text-anchor="middle">lite</text><text x="965" y="405" text-anchor="middle">lite</text></g><g fill="#252a28" font-size="17" font-weight="600"><text x="90" y="468">01 / Feather curve</text><text x="355" y="468">02 / Quill silhouette</text><text x="620" y="468">03 / Feather strokes</text><text x="885" y="468">04 / Light spark</text></g><g fill="#737b77" font-size="14"><text x="90" y="493">An enclosing feather,</text><text x="90" y="513">flowing into an l.</text><text x="355" y="493">A single tapered shape</text><text x="355" y="513">meeting a short foot.</text><text x="620" y="493">An unmistakable l with</text><text x="620" y="513">small angled barbs.</text><text x="885" y="493">A simple l paired with</text><text x="885" y="513">a tiny glint of light.</text></g></g>
<text x="70" y="611" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" fill="#535b57">Rough concept sketches: shape and balance still need refinement.</text>
<text x="70" y="642" font-family="Helvetica Neue,Arial,sans-serif" font-size="15" fill="#737b77">The final mark should remain recognizable in one color and at favicon size.</text>
</svg>
